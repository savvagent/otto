[package]
name = "otto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Otto — fast, MCP-first coding agent CLI"
default-run = "otto"

[[bin]]
name = "otto"
path = "src/main.rs"

# Shim binaries that re-export the auxiliary crates' run() entry points so
# `dist` ships one archive per platform with every binary. Each shim is
# ~10 lines and just calls the corresponding crate's `run()`.
[[bin]]
name = "otto-tool-fs"
path = "src/bin/otto-tool-fs.rs"

[[bin]]
name = "otto-tool-lsp"
path = "src/bin/otto-tool-lsp.rs"

[[bin]]
name = "otto-tool-bash"
path = "src/bin/otto-tool-bash.rs"

[[bin]]
name = "otto-tool-grep"
path = "src/bin/otto-tool-grep.rs"

[[bin]]
name = "otto-tool-web"
path = "src/bin/otto-tool-web.rs"

[[bin]]
name = "otto-anthropic"
path = "src/bin/otto-anthropic.rs"

[[bin]]
name = "otto-gemini"
path = "src/bin/otto-gemini.rs"

[[bin]]
name = "otto-openai"
path = "src/bin/otto-openai.rs"

[[bin]]
name = "otto-deepseek"
path = "src/bin/otto-deepseek.rs"

[dependencies]
otto-host = { workspace = true }
otto-plugin = { workspace = true }
otto-plugin-wasm = { workspace = true }
otto-canvas = { workspace = true }
otto-protocol = { workspace = true }
otto-mcp = { workspace = true }
provider-anthropic = { workspace = true }
provider-deepseek = { workspace = true }
provider-gemini = { workspace = true }
provider-local = { workspace = true }
provider-openai = { workspace = true }
tool-fs = { workspace = true }
tool-lsp = { workspace = true }
tool-bash = { workspace = true }
tool-grep = { workspace = true }
tool-web = { workspace = true }
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
dirs.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tui-spinner.workspace = true
ratatui-image.workspace = true
image.workspace = true
ratatui-themes.workspace = true
rust-i18n.workspace = true
tui-markdown.workspace = true
tui-textarea.workspace = true
ratatui-explorer.workspace = true
keyring.workspace = true
reqwest.workspace = true
axum = { workspace = true, features = ["query"] }
rmcp.workspace = true
self_update.workspace = true
semver.workspace = true
# user-defined slash commands
serde_yaml_ng.workspace = true
ignore.workspace = true
# user-defined hooks — tool-name matching
globset.workspace = true
# `/lsp` installer
flate2.workspace = true
tar.workspace = true
zip.workspace = true
sha2.workspace = true
hex.workspace = true
which.workspace = true
uuid.workspace = true
# `/plugins install` stages downloaded plugin.toml + plugin.wasm in a temp
# dir before the trust modal moves it into `~/.otto/plugins/<id>/`.
tempfile = "3"

[dev-dependencies]
rmcp.workspace = true
serial_test = "3"
tempfile = "3"
tokio = { version = "1.52", features = ["test-util"] }
httpmock = "0.7"

# `.deb` packaging via `cargo deb` (https://github.com/kornelski/cargo-deb).
# Not part of the `cargo-dist` release pipeline above (dist doesn't build
# deb/rpm); a separate `.github/workflows/package-linux.yml` job runs
# `cargo deb` against the same release build and uploads the artifact to
# the GitHub Release cargo-dist already created for the tag.
[package.metadata.deb]
name = "otto"
maintainer = "Rob Hicks"
copyright = "2024-2026, Rob Hicks"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A fast, MCP-first terminal coding agent. Ships the otto TUI plus its \
bundled stdio MCP tool servers (fs, bash, grep, lsp, web) and standalone \
provider shims (anthropic, gemini, openai, deepseek)."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["../../target/release/otto", "usr/bin/otto", "755"],
    ["../../target/release/otto-tool-fs", "usr/bin/otto-tool-fs", "755"],
    ["../../target/release/otto-tool-bash", "usr/bin/otto-tool-bash", "755"],
    ["../../target/release/otto-tool-grep", "usr/bin/otto-tool-grep", "755"],
    ["../../target/release/otto-tool-lsp", "usr/bin/otto-tool-lsp", "755"],
    ["../../target/release/otto-tool-web", "usr/bin/otto-tool-web", "755"],
    ["../../target/release/otto-anthropic", "usr/bin/otto-anthropic", "755"],
    ["../../target/release/otto-gemini", "usr/bin/otto-gemini", "755"],
    ["../../target/release/otto-openai", "usr/bin/otto-openai", "755"],
    ["../../target/release/otto-deepseek", "usr/bin/otto-deepseek", "755"],
    ["../../README.md", "usr/share/doc/otto/README.md", "644"],
]

# `.rpm` packaging via `cargo generate-rpm`
# (https://github.com/cat-in-136/cargo-generate-rpm). Same binaries as the
# deb package above; kept in sync manually since neither tool shares config.
[package.metadata.generate-rpm]
name = "otto"
license = "AGPL-3.0-or-later"
assets = [
    { source = "../../target/release/otto", dest = "/usr/bin/otto", mode = "755" },
    { source = "../../target/release/otto-tool-fs", dest = "/usr/bin/otto-tool-fs", mode = "755" },
    { source = "../../target/release/otto-tool-bash", dest = "/usr/bin/otto-tool-bash", mode = "755" },
    { source = "../../target/release/otto-tool-grep", dest = "/usr/bin/otto-tool-grep", mode = "755" },
    { source = "../../target/release/otto-tool-lsp", dest = "/usr/bin/otto-tool-lsp", mode = "755" },
    { source = "../../target/release/otto-tool-web", dest = "/usr/bin/otto-tool-web", mode = "755" },
    { source = "../../target/release/otto-anthropic", dest = "/usr/bin/otto-anthropic", mode = "755" },
    { source = "../../target/release/otto-gemini", dest = "/usr/bin/otto-gemini", mode = "755" },
    { source = "../../target/release/otto-openai", dest = "/usr/bin/otto-openai", mode = "755" },
    { source = "../../target/release/otto-deepseek", dest = "/usr/bin/otto-deepseek", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/otto/README.md", mode = "644" },
]
