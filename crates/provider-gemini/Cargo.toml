[package]
name = "provider-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Google Gemini API as a Otto SPP provider"

# Library only. The `otto-gemini` binary lives in the `otto` crate
# (a thin shim around `provider_gemini::run`) so the release archive can ship
# all four binaries under a single installer.
[lib]
name = "provider_gemini"
path = "src/lib.rs"

[dependencies]
otto-protocol.workspace = true
otto-mcp.workspace = true
otto-fence.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
dotenvy.workspace = true
futures.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true, features = ["json"] }
