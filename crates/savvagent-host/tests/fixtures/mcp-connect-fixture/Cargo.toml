[package]
name = "mcp-connect-fixture"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test-only MCP server fixture for savvagent-host tool-registry tests."

[lib]
name = "mcp_connect_fixture"
path = "src/lib.rs"

[[bin]]
name = "mcp-connect-fixture"
path = "src/main.rs"

[[bin]]
name = "tool-bash-fixture"
path = "src/bin/tool-bash-fixture.rs"

[dependencies]
anyhow.workspace = true
rmcp = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
